[project]
name = "opspulse-ai"
version = "1.3.0"
description = "Incident investigation and root-cause analysis assistant with human-reviewed GitHub remediation"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt (used by Docker and CI).

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["evals/reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is the pytest idiom
    "RUF001", # ambiguous unicode in strings (intentional zero-width space in PR bodies)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "BLE001"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
