name: Security

# Dependency vulnerabilities and static analysis. Kept out of the main CI so that a newly published advisory
# cannot turn an unrelated pull request red; it runs on pushes to main, weekly, and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: pip install "pip-audit>=2.7,<3"
      - name: Audit pinned runtime requirements
        run: pip-audit -r requirements.txt --progress-spinner off

  properties:
    name: Property-based tests (exploratory, random seeds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Hunt for new counterexamples
        env:
          HYPOTHESIS_EXPLORE: "1"
          HYPOTHESIS_EXAMPLES: "2000"
        run: pytest -q tests/unit/test_properties.py tests/unit/test_fuzz_model_output.py tests/unit/test_fuzz_ask.py
      - name: Hunt for counterexamples in the console helpers (random seed, printed on failure)
        run: FUZZ_RUNS=50000 FUZZ_SEED=$RANDOM node --test tests/js/util.fuzz.test.js

  codeql:
    name: CodeQL (Python and JavaScript)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: python, javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: "/language:python-and-js"
