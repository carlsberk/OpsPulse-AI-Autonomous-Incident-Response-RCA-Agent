name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, offline evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets are used: unit tests, migrations and the mock evaluation run fully offline.
    env:
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check src tests evals scripts migrations

      - name: Ruff format check
        run: ruff format --check src tests evals scripts migrations

      - name: Type check
        run: mypy

      - name: Import / configuration smoke check
        run: python -c "import src.main; from src.services.incident_service import get_graph; get_graph()"

      - name: Unit tests with coverage
        # The floor sits just under the measured coverage (86%); it exists to catch an untested feature, not to chase a number.
        run: pytest --cov=src --cov=evals --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=84

      - name: Offline evaluation, regression gate against committed baselines
        # Scripted replies are deterministic, so any drop in a quality metric is a real behaviour change.
        run: |
          for dataset in tuning holdout adversarial callers reviewer_memory; do
            python -m evals.run_rca --mode mock --dataset "$dataset" --out /tmp/eval
            python -m evals.compare_reports "evals/baselines/rca-$dataset-mock.json" /tmp/eval/rca-$dataset-mock-*.json               --fail-on-regression
          done

      - name: Incident assistant evaluation (offline - routing, answer content, quote and approval-advice checks)
        run: |
          python -m evals.ask_eval --mode mock --out /tmp/ask-eval \
            --min rules_intent_accuracy=1 --min rules_content_correctness=1 --min grounded_answers_pass=1 \
            --min fabricated_quotes_flagged=1 --min uncited_answers_flagged=1 --min unanswerable_abstained=1 \
            --min approval_advice_blocked=1

      - name: Retrieval evaluation (fails on any cross-repository leak)
        run: python -m evals.run_retrieval

      - name: Demo (mock model, sandboxed test run)
        run: python -m scripts.demo

      - name: End-to-end flow (alert, review, draft PR; mock model, stubbed GitHub)
        run: python -m scripts.e2e_flow

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            coverage.xml
            evals/reports/
          if-no-files-found: ignore

  python-versions:
    name: Unit tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]  # 3.11 (the image's version) runs in the quality job
    env:
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q

  postgres:
    name: Migrations and tests on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: opspulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspulse -d opspulse"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://opspulse:ci-only-password@localhost:5432/opspulse
      TEST_DATABASE_URL: postgresql://opspulse:ci-only-password@localhost:5432/opspulse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations upgrade / downgrade / upgrade round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models and migrated schema agree
        run: alembic check

      - name: Unit tests against PostgreSQL
        run: pytest -q

  docker:
    name: Docker image and Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Prometheus alert rules are valid
        run: >
          docker run --rm -v "$PWD/deploy/prometheus:/rules:ro" --entrypoint promtool
          prom/prometheus:v3.15.0 check rules /rules/alerts.yml

      - name: Build
        run: docker build -t opspulse-ai:ci .

      - name: End-to-end smoke test (api + worker + PostgreSQL via Compose)
        run: bash scripts/compose_smoke.sh

  sandbox-docker:
    name: Sandbox against a real Docker daemon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Real fix, regression, missing test runner and five escape attempts (network, writes, root, secrets, fork bomb)
        env:
          RUN_DOCKER_TESTS: "1"
          DATABASE_URL: sqlite://
        run: pytest -q tests/integration/test_sandbox_docker.py
